<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trend Radar</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #12181f;
    --line: #232b34;
    --text: #dbe2ea;
    --dim: #7a8794;
    --signal: #4fd1a5;
    --amber: #e0a84e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  header {
    padding: 28px 24px 18px;
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 22px;
    letter-spacing: 0.2px;
  }
  header .sub {
    color: var(--dim);
    font-size: 13.5px;
  }
  .tabs {
    display: flex;
    gap: 4px;
    padding: 14px 24px 0;
    border-bottom: 1px solid var(--line);
  }
  .tab {
    padding: 10px 16px;
    font-size: 14px;
    color: var(--dim);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    user-select: none;
  }
  .tab.active {
    color: var(--text);
    border-bottom-color: var(--signal);
  }
  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 22px 24px 60px;
  }
  .group {
    margin-bottom: 26px;
  }
  .group-label {
    font-size: 12px;
    color: var(--dim);
    margin-bottom: 8px;
  }
  .item {
    display: block;
    padding: 12px 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    margin-bottom: 8px;
    text-decoration: none;
    color: var(--text);
  }
  .item:hover { border-color: var(--signal); }
  .item .title {
    font-size: 14.5px;
    margin-bottom: 4px;
  }
  .item .meta {
    font-size: 12px;
    color: var(--dim);
  }
  .item .meta .src { color: var(--amber); }
  .item .summary {
    font-size: 13px;
    color: var(--text);
    opacity: 0.85;
    margin-bottom: 4px;
  }
  .item .title-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    flex-wrap: wrap;
  }
  .score-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex: none;
  }
  .score-1, .score-2 { background: var(--dim); }
  .score-3 { background: var(--amber); }
  .score-4, .score-5 { background: var(--signal); }
  .cross-badge {
    font-size: 12px;
    cursor: help;
  }
  .empty, .loading {
    color: var(--dim);
    font-size: 13.5px;
    padding: 20px 0;
  }
  .chart-wrap {
    position: relative;
    margin-bottom: 22px;
  }
  .chart-label {
    font-size: 12px;
    color: var(--dim);
    margin-bottom: 6px;
  }
  .velocity-chart {
    display: block;
    width: 100%;
    height: 70px;
  }
  .chart-bar {
    fill: var(--signal);
    opacity: 0.75;
    cursor: pointer;
    transition: opacity 0.1s;
  }
  .chart-bar:hover, .chart-bar:active {
    opacity: 1;
  }
  .chart-tooltip {
    position: absolute;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 5px 9px;
    font-size: 11.5px;
    color: var(--text);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 5;
    transform: translateY(-100%);
  }
  footer {
    text-align: center;
    color: var(--dim);
    font-size: 12px;
    padding: 20px;
  }
</style>
</head>
<body>

<header>
  <h1>Trend Radar</h1>
  <div class="sub" id="updated">Đang tải dữ liệu…</div>
</header>

<div class="tabs" id="tabs"></div>

<main id="main">
  <div class="loading">Đang tải…</div>
</main>

<footer>Nguồn: Hacker News · arXiv · GitHub · RSS ngành — cập nhật tự động qua GitHub Actions</footer>

<script>
const TOPICS = [
  { key: "ai-tech", file: "data/ai-tech.json" },
  { key: "igaming", file: "data/igaming.json" },
  { key: "business", file: "data/business.json" },
  { key: "news", file: "data/news.json" },
];

let activeTopic = TOPICS[0].key;
let dataByTopic = {};
let historyByTopic = {};

function fmtDate(iso) {
  if (!iso) return "";
  try {
    const d = new Date(iso);
    return d.toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit", year: "numeric" });
  } catch (e) { return ""; }
}

function computeChartPoints(history) {
  const width = 600, height = 70, padX = 4, padY = 8;
  const sorted = history.slice().sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  const n = sorted.length;
  const maxTotal = Math.max(1, ...sorted.map(h => h.total_items || 0));
  const barW = (width - padX * 2) / n;
  return sorted.map((h, i) => {
    const barH = Math.max(2, (h.total_items || 0) / maxTotal * (height - padY * 2));
    return {
      x: padX + i * barW,
      y: height - padY - barH,
      w: Math.max(1, barW - 1.5),
      h: barH,
      date: h.date,
      total: h.total_items,
      avg: h.avg_relevance_score,
    };
  });
}

function renderVelocityChartHtml(points) {
  const width = 600, height = 70;
  const bars = points.map((p, i) =>
    `<rect class="chart-bar" data-idx="${i}" x="${p.x.toFixed(2)}" y="${p.y.toFixed(2)}" width="${p.w.toFixed(2)}" height="${p.h.toFixed(2)}" rx="1.5"></rect>`
  ).join("");
  return `<div class="chart-wrap">
    <div class="chart-label">Số item/ngày (${points.length} ngày gần nhất)</div>
    <svg class="velocity-chart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">${bars}</svg>
    <div class="chart-tooltip"></div>
  </div>`;
}

function wireChartTooltip(wrapEl, points) {
  if (!wrapEl) return;
  const tooltip = wrapEl.querySelector(".chart-tooltip");
  const bars = wrapEl.querySelectorAll(".chart-bar");
  if (!tooltip || !bars.length) return;

  function showTip(el, p) {
    const barRect = el.getBoundingClientRect();
    const wrapRect = wrapEl.getBoundingClientRect();
    const avgTxt = (p.avg === null || p.avg === undefined) ? "—" : p.avg;
    tooltip.innerHTML = `${escapeHtml(fmtDate(p.date))}<br>${p.total} item · điểm TB ${avgTxt}`;
    tooltip.style.left = Math.max(0, barRect.left - wrapRect.left - 10) + "px";
    tooltip.style.top = (barRect.top - wrapRect.top - 6) + "px";
    tooltip.style.opacity = "1";
  }
  function hideTip() { tooltip.style.opacity = "0"; }

  bars.forEach((el, i) => {
    el.addEventListener("mouseenter", () => showTip(el, points[i]));
    el.addEventListener("mouseleave", hideTip);
    el.addEventListener("click", (e) => { e.stopPropagation(); showTip(el, points[i]); });
  });
  document.addEventListener("click", hideTip);
}

function render() {
  const main = document.getElementById("main");
  const topic = dataByTopic[activeTopic];
  const history = historyByTopic[activeTopic] || [];

  if (!topic || !topic.items || topic.items.length === 0) {
    main.innerHTML = '<div class="empty">Chưa có dữ liệu cho chủ đề này — chờ lần chạy tự động tiếp theo, hoặc chạy workflow thủ công trong tab Actions.</div>';
    return;
  }

  let chartPoints = null;
  let chartHtml = "";
  if (history.length > 0) {
    chartPoints = computeChartPoints(history);
    chartHtml = renderVelocityChartHtml(chartPoints);
  }

  const bySource = {};
  topic.items.forEach(it => {
    const s = it.source || "Khác";
    if (!bySource[s]) bySource[s] = [];
    bySource[s].push(it);
  });

  let html = chartHtml;
  Object.keys(bySource).forEach(src => {
    html += `<div class="group"><div class="group-label">${src} (${bySource[src].length})</div>`;
    bySource[src].forEach(it => {
      const meta = [it.meta, fmtDate(it.published)].filter(Boolean).join(" · ");
      const score = Number.isInteger(it.relevance_score) ? it.relevance_score : null;
      const scoreDot = score
        ? `<span class="score-dot score-${score}" title="Độ liên quan: ${score}/5"></span>`
        : "";
      const crossBadge = it.cross_source
        ? `<span class="cross-badge" title="Cùng chủ đề với: ${escapeHtml((it.correlated_with || []).join(", "))}">🔥</span>`
        : "";
      const summary = it.summary
        ? `<div class="summary">${escapeHtml(it.summary)}</div>`
        : "";
      html += `<a class="item" href="${it.url || '#'}" target="_blank" rel="noopener">
        <div class="title-row">
          ${scoreDot}
          <div class="title">${escapeHtml(it.title || "(no title)")}</div>
          ${crossBadge}
        </div>
        ${summary}
        <div class="meta"><span class="src">${escapeHtml(it.source || "")}</span> — ${escapeHtml(meta)}</div>
      </a>`;
    });
    html += `</div>`;
  });
  main.innerHTML = html;

  if (chartPoints) {
    wireChartTooltip(main.querySelector(".chart-wrap"), chartPoints);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderTabs() {
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  TOPICS.forEach(t => {
    const label = (dataByTopic[t.key] && dataByTopic[t.key].label) || t.key;
    const el = document.createElement("div");
    el.className = "tab" + (t.key === activeTopic ? " active" : "");
    el.textContent = label;
    el.onclick = () => { activeTopic = t.key; renderTabs(); render(); };
    tabsEl.appendChild(el);
  });
}

async function loadAll() {
  for (const t of TOPICS) {
    try {
      const res = await fetch(t.file + "?_=" + Date.now());
      dataByTopic[t.key] = await res.json();
    } catch (e) {
      dataByTopic[t.key] = { label: t.key, items: [] };
    }
    try {
      const res = await fetch(`data/history/${t.key}.json?_=` + Date.now());
      const h = res.ok ? await res.json() : [];
      historyByTopic[t.key] = Array.isArray(h) ? h : [];
    } catch (e) {
      historyByTopic[t.key] = [];
    }
  }
  try {
    const manifest = await (await fetch("data/manifest.json?_=" + Date.now())).json();
    document.getElementById("updated").textContent =
      "Cập nhật lần cuối: " + new Date(manifest.updated).toLocaleString("vi-VN");
  } catch (e) {
    document.getElementById("updated").textContent = "Chưa có lần cập nhật nào — hãy chạy workflow lần đầu.";
  }
  renderTabs();
  render();
}

loadAll();
</script>

</body>
</html>
