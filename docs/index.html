<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trend Radar</title>
<style>
:root {
  --bg: #0a0e14;
  --surface: #12171e;
  --surface-2: #1a2029;
  --border: #252d38;
  --border-h: #3a4553;
  --text: #e2e8f0;
  --dim: #64748b;
  --accent: #22c55e;
  --accent-bg: rgba(34,197,94,0.1);
  --amber: #eab308;
  --amber-bg: rgba(234,179,8,0.1);
  --blue: #3b82f6;
  --blue-bg: rgba(59,130,246,0.1);
  --red: #ef4444;
  --red-bg: rgba(239,68,68,0.1);
  --purple: #a855f7;
  --R: 10px;
  --Rs: 6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;line-height:1.6;min-height:100vh}

/* header */
.hdr{padding:24px 28px 0;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.hdr h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
.hdr h1 b{color:var(--accent);font-weight:700}
.hdr .upd{font-size:12px;color:var(--dim)}

/* tabs */
.tabs{display:flex;gap:2px;padding:14px 28px 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:7px 16px;font-size:13px;color:var(--dim);cursor:pointer;border-radius:var(--Rs);white-space:nowrap;transition:.15s;user-select:none}
.tab:hover{color:var(--text);background:var(--surface)}
.tab.on{color:var(--accent);background:var(--accent-bg);font-weight:600}
.tab .cnt{font-size:11px;opacity:.7;margin-left:3px}

/* container */
.ct{max-width:1100px;margin:0 auto;padding:20px 28px 60px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.st{background:var(--surface);border:1px solid var(--border);border-radius:var(--R);padding:16px 18px}
.st-v{font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1.2}
.st-l{font-size:11.5px;color:var(--dim);margin-top:3px}
.st-up{color:var(--accent)}.st-dn{color:var(--red)}.st-eq{color:var(--dim)}

/* section */
.sec{margin-bottom:22px}
.sec-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.sec-t{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;font-weight:600}

/* keywords */
.kws{display:flex;flex-wrap:wrap;gap:7px}
.kw{padding:4px 13px;background:var(--surface);border:1px solid var(--border);border-radius:18px;font-size:12.5px;color:var(--text);cursor:pointer;transition:.15s;user-select:none}
.kw:hover{border-color:var(--accent);color:var(--accent)}
.kw.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.kw .n{font-size:10.5px;color:var(--dim);margin-left:3px}

/* chart */
.chart-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--R);padding:16px 18px;position:relative}
.vel-chart{display:block;width:100%;height:110px}
.c-bar{fill:var(--accent);opacity:.55;cursor:pointer;transition:opacity .1s}
.c-bar:hover,.c-bar:active{opacity:1}
.c-grid{stroke:var(--border);stroke-width:.5}
.c-tip{position:absolute;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--Rs);padding:7px 11px;font-size:11.5px;color:var(--text);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:10;transform:translateY(-110%);box-shadow:0 4px 12px rgba(0,0,0,.3)}

/* source bar */
.src-bar{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:14px}
.src-seg{transition:flex .3s}
.src-leg{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:8px}
.src-leg-i{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--dim)}
.src-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* controls */
.ctrls{display:flex;gap:8px;align-items:center}
.ctrls select,.ctrls input{background:var(--surface);border:1px solid var(--border);border-radius:var(--Rs);color:var(--text);padding:5px 10px;font-size:12.5px;outline:none;transition:border-color .15s}
.ctrls select:focus,.ctrls input:focus{border-color:var(--accent)}
.ctrls input{width:160px}
@media(max-width:640px){.ctrls input{width:110px}}

/* items grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:768px){.grid{grid-template-columns:1fr}}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--R);padding:14px 16px;text-decoration:none;color:var(--text);transition:.15s;position:relative}
.card:hover{border-color:var(--border-h);background:var(--surface-2);transform:translateY(-1px)}
.card-src{font-size:10.5px;color:var(--amber);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-bottom:5px}
.card-ttl{font-size:13.5px;font-weight:600;line-height:1.45;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-sum{font-size:12px;color:var(--dim);margin-bottom:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-bt{margin-top:auto;display:flex;align-items:center;gap:7px;font-size:11px;color:var(--dim);flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;padding:1px 7px;border-radius:9px;font-size:10px;font-weight:600}
.b-hot{background:var(--red-bg);color:var(--red)}
.b-new{background:var(--accent-bg);color:var(--accent)}
.b-score{background:var(--blue-bg);color:var(--blue)}
.dots{display:flex;gap:2px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--border)}
.dot.f{background:var(--accent)}.dot.m{background:var(--amber)}

/* ranking */
.rank{background:var(--surface);border:1px solid var(--border);border-radius:var(--R);overflow:hidden}
.rank-row{display:flex;align-items:center;padding:9px 16px;gap:10px;border-bottom:1px solid var(--border);font-size:13px;text-decoration:none;color:var(--text);transition:.12s}
.rank-row:last-child{border-bottom:none}
.rank-row:hover{background:var(--surface-2)}
.rank-n{width:22px;color:var(--dim);font-weight:700;font-size:12px;text-align:center;flex-shrink:0}
.rank-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.rank-stars{color:var(--amber);font-size:12px;flex-shrink:0}
.rank-delta{font-size:11px;flex-shrink:0;min-width:55px;text-align:right}
.rank-delta.up{color:var(--accent)}.rank-delta.dn{color:var(--red)}.rank-delta.eq{color:var(--dim)}
.rank-sum{font-size:11px;color:var(--dim);padding:0 16px 8px 48px;line-height:1.5;border-bottom:1px solid var(--border)}

/* category chart */
.cat-chart{display:flex;align-items:flex-end;gap:6px;padding:0 4px;margin-bottom:14px}
.cat-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:opacity .15s}
.cat-col:hover{opacity:1!important}
.cat-col .bar{width:100%;border-radius:4px 4px 0 0;transition:height .3s}
.cat-col .lbl{font-size:9.5px;color:var(--dim);text-align:center;line-height:1.2;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-col .cnt{font-size:11px;font-weight:600}
.cat-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:8px 0 4px}
.cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cat-label{font-size:12px;font-weight:600}.cat-count{font-size:11px;color:var(--dim)}

/* recommended */
.rec-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:768px){.rec-grid{grid-template-columns:1fr}}
.rec-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--R);padding:12px 16px;text-decoration:none;color:var(--text);display:flex;flex-direction:column;gap:5px;transition:.15s}
.rec-card:hover{border-color:var(--border-h);background:var(--surface-2)}
.rec-top{display:flex;justify-content:space-between;align-items:center}
.rec-name{font-size:13px;font-weight:600}
.rec-stars{font-size:11px;color:var(--amber);flex-shrink:0}
.rec-cat{font-size:10px;text-transform:uppercase;font-weight:600;letter-spacing:.3px}
.rec-desc{font-size:11.5px;color:var(--dim);line-height:1.5}
.rec-why{font-size:11px;color:var(--accent);margin-top:auto;padding-top:2px}

/* empty / loading */
.empty{text-align:center;padding:50px 20px;color:var(--dim)}
.empty p{font-size:13.5px;margin-top:8px}
.loading{color:var(--dim);font-size:13.5px;padding:40px 0;text-align:center}

footer{text-align:center;color:var(--dim);font-size:11.5px;padding:20px;border-top:1px solid var(--border)}
</style>
</head>
<body>

<div class="hdr">
  <h1>Trend <b>Radar</b></h1>
  <div class="upd" id="upd">Đang tải…</div>
</div>
<div class="tabs" id="tabs"></div>
<div class="ct" id="ct"><div class="loading">Đang tải dữ liệu…</div></div>
<footer>Hacker News · arXiv · GitHub · RSS — cập nhật tự động qua GitHub Actions</footer>

<script>
const TOPICS=[
  {key:"ai-tech",file:"data/ai-tech.json"},
  {key:"igaming",file:"data/igaming.json"},
  {key:"business",file:"data/business.json"},
  {key:"news",file:"data/news.json"},
];
const PAL=['#3b82f6','#22c55e','#eab308','#a855f7','#f97316','#06b6d4','#ec4899','#6366f1','#14b8a6','#ef4444'];
const STOPS=new Set(['the','a','an','and','or','but','in','on','at','to','for','of','with','by','from','is','are','was','were','be','been','has','have','had','will','can','may','could','would','should','this','that','these','those','it','its','new','how','what','why','when','where','who','which','not','no','all','more','than','into','over','your','our','their','you','we','they','he','she','do','does','did','get','set','use','up','out','about','just','also','very','so','if','then','as','my','me','us','am','being','each','every','both','few','most','other','some','such','only','own','same','too','after','before','above','below','between','during','through','via','per','using','based','via','two','one','three','four','five','first','using','based','under','top',
'và','của','cho','trong','với','là','được','có','này','đó','các','một','những','để','từ','theo','về','trên','sẽ','khi','không','nhưng','hay','hoặc','đã','đang','cũng','như','tại','ra','vào','lên','xuống','giữa','bởi','mà','thì','nên','rằng','nào','đều','vẫn','qua','đến','bị','mới','nhất','hơn','rất','quá','chỉ','vì','nếu','tuy','dù','sau','trước','giờ','ngày','năm','tháng','còn','lại','đây','kia','nhiều','ít','lớn','nhỏ','tin','tức','bài','viết']);

let active=TOPICS[0].key, data={}, hist={}, recommended=[], filterText='', sortBy='date', activeKw=null;

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtD(iso){if(!iso)return'';try{return new Date(iso).toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'})}catch(e){return''}}

function extractKw(items,limit){
  limit=limit||12;
  const freq={};
  items.forEach(it=>{
    const words=(it.title||'').toLowerCase().split(/[\s\-–—:;,.()\[\]{}"'`!?|\/\\<>@#$%^&*+=~]+/);
    const seen=new Set();
    words.forEach(w=>{
      w=w.trim();
      if(w.length<2||STOPS.has(w)||/^\d+$/.test(w))return;
      if(!seen.has(w)){seen.add(w);freq[w]=(freq[w]||0)+1}
    });
  });
  return Object.entries(freq).filter(([_,c])=>c>=2).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([w,c])=>({word:w,count:c}));
}

function getStats(items,history){
  const total=items.length;
  const sources=[...new Set(items.map(i=>i.source))];
  const now=Date.now(),day=864e5;
  const fresh=items.filter(i=>i.published&&(now-new Date(i.published).getTime())<day).length;
  let delta=null;
  if(history&&history.length>=2){
    const s=history.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    delta=(s[0].total_items||0)-(s[1].total_items||0);
  }
  return{total,sources,fresh,delta};
}

function srcColor(src,allSrc){return PAL[allSrc.indexOf(src)%PAL.length]}

function renderTabs(){
  const el=document.getElementById('tabs');el.innerHTML='';
  TOPICS.forEach(t=>{
    const d=data[t.key];
    const label=d&&d.label?d.label:t.key;
    const count=d&&d.items?d.items.length:0;
    const tab=document.createElement('div');
    tab.className='tab'+(t.key===active?' on':'');
    tab.innerHTML=esc(label)+'<span class="cnt">('+count+')</span>';
    tab.onclick=()=>{active=t.key;filterText='';activeKw=null;sortBy='date';renderTabs();render()};
    el.appendChild(tab);
  });
}

function render(){
  const ct=document.getElementById('ct');
  const topic=data[active];
  const history=hist[active]||[];
  if(!topic||!topic.items||!topic.items.length){
    ct.innerHTML='<div class="empty"><p>Chưa có dữ liệu — chờ workflow chạy hoặc trigger thủ công trong Actions.</p></div>';
    return;
  }
  const items=topic.items;
  const stats=getStats(items,history);
  const keywords=extractKw(items);
  let html='';

  // Stats row
  const deltaSign=stats.delta>0?'+':'';
  const deltaCls=stats.delta>0?'st-up':stats.delta<0?'st-dn':'st-eq';
  const deltaVal=stats.delta!==null?deltaSign+stats.delta:'—';
  html+=`<div class="stats">
    <div class="st"><div class="st-v">${stats.total}</div><div class="st-l">Tổng item</div></div>
    <div class="st"><div class="st-v ${deltaCls}">${deltaVal}</div><div class="st-l">So với lần trước</div></div>
    <div class="st"><div class="st-v">${stats.sources.length}</div><div class="st-l">Nguồn dữ liệu</div></div>
    <div class="st"><div class="st-v">${stats.fresh}</div><div class="st-l">Mới trong 24h</div></div>
  </div>`;

  // Trending keywords
  if(keywords.length){
    html+=`<div class="sec"><div class="sec-t">Chủ đề nổi bật</div><div class="kws" id="kws">`;
    keywords.forEach(k=>{
      const on=activeKw===k.word?' on':'';
      html+=`<span class="kw${on}" data-kw="${esc(k.word)}">${esc(k.word)}<span class="n">${k.count}</span></span>`;
    });
    html+=`</div></div>`;
  }

  // Chart + source breakdown
  if(history.length>1){
    html+=`<div class="sec"><div class="sec-t">Hoạt động</div>`;
    html+=renderChart(history);
    html+=renderSrcBar(items,stats.sources);
    html+=`</div>`;
  }

  // GitHub ranking
  html+=renderRanking(items,history);

  // Items
  html+=`<div class="sec"><div class="sec-hd"><div class="sec-t">Danh sách</div>
    <div class="ctrls">
      <select id="sort-sel"><option value="date">Mới nhất</option><option value="score">Điểm cao</option><option value="source">Theo nguồn</option></select>
      <input type="text" id="filter-in" placeholder="Lọc tiêu đề…" value="${esc(filterText)}">
    </div></div>`;
  html+=`<div class="grid" id="items-grid">`;
  html+=renderItems(items,stats.sources);
  html+=`</div></div>`;

  html+=renderRecommended();

  ct.innerHTML=html;
  wireEvents(history);
}

function renderChart(history){
  const W=700,H=110,px=6,py=10;
  const sorted=history.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const n=sorted.length;
  const mx=Math.max(1,...sorted.map(h=>h.total_items||0));
  const bw=(W-px*2)/n;
  let bars='',gridLines='';
  const steps=[Math.round(mx*.25),Math.round(mx*.5),Math.round(mx*.75),mx];
  steps.forEach(s=>{
    const y=H-py-((s/mx)*(H-py*2));
    gridLines+=`<line class="c-grid" x1="${px}" y1="${y.toFixed(1)}" x2="${W-px}" y2="${y.toFixed(1)}"/>`;
  });
  const points=sorted.map((h,i)=>{
    const bh=Math.max(2,(h.total_items||0)/mx*(H-py*2));
    const x=px+i*bw, y=H-py-bh;
    bars+=`<rect class="c-bar" data-idx="${i}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1,bw-1.5).toFixed(1)}" height="${bh.toFixed(1)}" rx="2"/>`;
    return{x,y,w:bw,h:bh,date:h.date,total:h.total_items,avg:h.avg_relevance_score};
  });
  return `<div class="chart-box" id="chart-box">
    <svg class="vel-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${gridLines}${bars}</svg>
    <div class="c-tip" id="c-tip"></div>
  </div>`;
}

const CAT_COLORS={'agent framework':'#06b6d4','web scraping':'var(--blue)','rag':'var(--purple)','video/media':'#ec4899','dev tool':'#6366f1','trading':'var(--amber)','ai app':'#6366f1','resource':'#f97316','tối ưu chi phí':'var(--accent)'};
function detectCategory(item){
  if(item.category){const lc=item.category.toLowerCase();return{k:lc.replace(/[^a-z]/g,''),l:item.category,c:CAT_COLORS[lc]||'var(--dim)'};}
  const t=((item.summary||'')+' '+(item.title||'')+' '+(item.matched_keyword||'')).toLowerCase();
  if(/trading|financial|finance/.test(t))return{k:'trade',l:'Trading',c:'var(--amber)'};
  if(/crawl|scrape|web.?data|spider/.test(t))return{k:'scrape',l:'Web Scraping',c:'var(--blue)'};
  if(/\brag\b|retrieval|knowledge.?base/.test(t))return{k:'rag',l:'RAG',c:'var(--purple)'};
  if(/video|image.?gen|diffusion|animation|toonflow|frame|vfx|film|media.?gen|short.?video|movie|cinema/.test(t))return{k:'video',l:'Video / Media',c:'#ec4899'};
  if(/token.?reduc|caveman|cost.?optim/.test(t))return{k:'cost',l:'Tối ưu chi phí',c:'var(--accent)'};
  if(/awesome|100\+|collection|tutorial|course|curated|教程|开源/.test(t))return{k:'learn',l:'Tài nguyên học',c:'#f97316'};
  if(/desktop.?ai|all.?in.?one|studio|local.?ai/.test(t))return{k:'app',l:'AI App',c:'#6366f1'};
  if(/agent|harness|workflow|agentic|orchestrat|sub.?agent/.test(t))return{k:'agent',l:'Agent Framework',c:'#06b6d4'};
  return{k:'other',l:'Khác',c:'var(--dim)'};
}

function renderRanking(items,history){
  const ghItems=items.filter(i=>i.source==='GitHub'&&typeof i.score==='number').sort((a,b)=>b.score-a.score);
  if(!ghItems.length)return'';

  const sorted=history.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const d7=sorted.find(h=>{const age=(Date.now()-new Date(h.date).getTime())/864e5;return age>=6&&age<=9});
  const old=d7&&Array.isArray(d7.top_repos)?Object.fromEntries(d7.top_repos.map(r=>[r.name,r.stars])):{};
  const seen14=new Set();
  sorted.filter(h=>{const age=(Date.now()-new Date(h.date).getTime())/864e5;return age<=15}).forEach(h=>{
    (h.top_repos||[]).forEach(r=>seen14.add(r.name));
  });

  const groups={};
  ghItems.forEach(it=>{
    const cat=detectCategory(it);
    it._cat=cat;
    if(!groups[cat.k])groups[cat.k]={label:cat.l,color:cat.c,items:[]};
    groups[cat.k].items.push(it);
  });
  const catEntries=Object.entries(groups).sort((a,b)=>b[1].items.length-a[1].items.length);
  const maxCat=Math.max(...catEntries.map(([_,g])=>g.items.length));

  let chart='<div class="cat-chart" style="height:70px">';
  catEntries.forEach(([k,g])=>{
    const h=Math.max(4,g.items.length/maxCat*50);
    chart+=`<div class="cat-col"><span class="cnt" style="color:${g.color}">${g.items.length}</span><div class="bar" style="background:${g.color};opacity:.55;height:${h}px"></div><span class="lbl">${g.label}</span></div>`;
  });
  chart+='</div>';

  let list='';
  catEntries.forEach(([k,g])=>{
    list+=`<div class="cat-hd"><span class="cat-dot" style="background:${g.color}"></span><span class="cat-label">${g.label}</span><span class="cat-count">(${g.items.length})</span></div><div class="rank">`;
    g.items.forEach((it,i)=>{
      const name=it.title||'';
      const stars=it.score;
      const fmtS=stars>=1000?(stars/1000).toFixed(1)+'k':stars;
      let deltaHtml='';
      if(name in old){const d=stars-old[name];deltaHtml=d>0?`<span class="rank-delta up">+${d>=1000?(d/1000).toFixed(1)+'k':d}</span>`:d<0?`<span class="rank-delta dn">${d}</span>`:`<span class="rank-delta eq">—</span>`}
      else if(seen14.size>0&&!seen14.has(name)){deltaHtml=`<span class="badge b-new">MỚI</span>`}
      else{deltaHtml=`<span class="rank-delta eq">—</span>`}
      let row=`<a class="rank-row" href="${it.url||'#'}" target="_blank" rel="noopener"><span class="rank-n">${i+1}</span><span class="rank-name">${esc(name)}</span><span class="rank-stars">${fmtS} ★</span>${deltaHtml}</a>`;
      if(it.what){let d=`<div class="rank-sum">${esc(it.what)}`;if(it.apply)d+=`<br><span style="color:var(--accent)">→ ${esc(it.apply)}</span>`;row+=d+'</div>';}
      else if(it.summary)row+=`<div class="rank-sum">${esc(it.summary.substring(0,150))}</div>`;
      list+=row;
    });
    list+='</div>';
  });

  return`<div class="sec"><div class="sec-t">GitHub Insights — Phân tích theo nhóm</div>${chart}${list}</div>`;
}

function renderSrcBar(items,sources){
  const counts={};
  items.forEach(i=>{counts[i.source]=(counts[i.source]||0)+1});
  const total=items.length;
  let barHtml='<div class="src-bar">';
  let legHtml='<div class="src-leg">';
  sources.forEach(s=>{
    const c=counts[s]||0;
    const pct=(c/total*100).toFixed(1);
    const col=srcColor(s,sources);
    barHtml+=`<div class="src-seg" style="flex:${c};background:${col}"></div>`;
    legHtml+=`<div class="src-leg-i"><span class="src-dot" style="background:${col}"></span>${esc(s)} (${c})</div>`;
  });
  return barHtml+'</div>'+legHtml+'</div>';
}

function renderItems(items,sources){
  let filtered=items.slice();
  const q=(filterText||'').toLowerCase();
  if(q)filtered=filtered.filter(i=>(i.title||'').toLowerCase().includes(q));
  if(activeKw)filtered=filtered.filter(i=>(i.title||'').toLowerCase().includes(activeKw));
  if(sortBy==='score')filtered.sort((a,b)=>(b.relevance_score||0)-(a.relevance_score||0));
  else if(sortBy==='source')filtered.sort((a,b)=>(a.source||'').localeCompare(b.source||''));
  else filtered.sort((a,b)=>{
    const da=a.published?new Date(a.published).getTime():0;
    const db=b.published?new Date(b.published).getTime():0;
    return db-da;
  });
  if(!filtered.length)return'<div class="empty" style="grid-column:1/-1"><p>Không tìm thấy item nào.</p></div>';
  const now=Date.now(),day=864e5;
  return filtered.map(it=>{
    const isNew=it.published&&(now-new Date(it.published).getTime())<day;
    const col=srcColor(it.source,sources);
    let badges='';
    if(it.cross_source)badges+=`<span class="badge b-hot">CROSS</span>`;
    if(isNew)badges+=`<span class="badge b-new">MỚI</span>`;
    if(Number.isInteger(it.relevance_score)){
      let dots='';
      for(let i=1;i<=5;i++){
        const cls=i<=it.relevance_score?(it.relevance_score>=4?'f':'m'):'';
        dots+=`<span class="dot ${cls}"></span>`;
      }
      badges+=`<span class="dots">${dots}</span>`;
    }
    const summary=it.summary?`<div class="card-sum">${esc(it.summary)}</div>`:'';
    return`<a class="card" href="${it.url||'#'}" target="_blank" rel="noopener">
      <div class="card-src" style="color:${col}">${esc(it.source||'')}</div>
      <div class="card-ttl">${esc(it.title||'(no title)')}</div>
      ${summary}
      <div class="card-bt">${fmtD(it.published)} ${badges}</div>
    </a>`;
  }).join('');
}

function renderRecommended(){
  if(!recommended.length)return'';
  let cards=recommended.map(r=>{
    const fmtS=r.stars>=1000?(r.stars/1000).toFixed(1)+'k':r.stars;
    return`<a class="rec-card" href="${r.url}" target="_blank" rel="noopener">
      <div class="rec-top"><span class="rec-name">${esc(r.name)}</span><span class="rec-stars">${fmtS} ★</span></div>
      <span class="rec-cat" style="color:${r.catColor||'var(--dim)'}">${esc(r.cat)}</span>
      <div class="rec-desc">${esc(r.desc)}</div>
      <div class="rec-why">→ ${esc(r.apply)}</div>
    </a>`;
  }).join('');
  return`<div class="sec"><div class="sec-t">Công cụ đề xuất cho Trend Radar</div><div class="rec-grid">${cards}</div></div>`;
}

function wireEvents(history){
  // Chart tooltip
  const box=document.getElementById('chart-box');
  if(box){
    const sorted=history.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const tip=document.getElementById('c-tip');
    box.querySelectorAll('.c-bar').forEach(el=>{
      const idx=+el.dataset.idx;
      const h=sorted[idx];
      if(!h)return;
      const show=()=>{
        const r=el.getBoundingClientRect(),br=box.getBoundingClientRect();
        const avgT=h.avg_relevance_score!=null?h.avg_relevance_score:'—';
        tip.innerHTML=`${esc(fmtD(h.date))}<br>${h.total_items} item · TB ${avgT}`;
        tip.style.left=Math.max(0,r.left-br.left-10)+'px';
        tip.style.top=(r.top-br.top-4)+'px';
        tip.style.opacity='1';
      };
      el.addEventListener('mouseenter',show);
      el.addEventListener('mouseleave',()=>{tip.style.opacity='0'});
      el.addEventListener('click',e=>{e.stopPropagation();show()});
    });
    document.addEventListener('click',()=>{if(tip)tip.style.opacity='0'});
  }

  // Keywords
  document.querySelectorAll('.kw').forEach(el=>{
    el.addEventListener('click',()=>{
      const w=el.dataset.kw;
      activeKw=activeKw===w?null:w;
      render();
    });
  });

  // Sort
  const sel=document.getElementById('sort-sel');
  if(sel){sel.value=sortBy;sel.addEventListener('change',()=>{sortBy=sel.value;render()})}

  // Filter
  const inp=document.getElementById('filter-in');
  if(inp){
    inp.addEventListener('input',()=>{filterText=inp.value;render()});
    inp.focus();
    inp.setSelectionRange(inp.value.length,inp.value.length);
  }
}

async function loadAll(){
  const fetches=TOPICS.map(async t=>{
    try{const r=await fetch(t.file+'?_='+Date.now());data[t.key]=await r.json()}
    catch(e){data[t.key]={label:t.key,items:[]}}
    try{const r=await fetch(`data/history/${t.key}.json?_=`+Date.now());const h=r.ok?await r.json():[];hist[t.key]=Array.isArray(h)?h:[]}
    catch(e){hist[t.key]=[]}
  });
  await Promise.all(fetches);
  try{recommended=await(await fetch('data/recommended.json?_='+Date.now())).json()}catch(e){recommended=[]}
  try{
    const m=await(await fetch('data/manifest.json?_='+Date.now())).json();
    document.getElementById('upd').textContent='Cập nhật: '+new Date(m.updated).toLocaleString('vi-VN');
  }catch(e){document.getElementById('upd').textContent='Chưa có lần cập nhật nào'}
  renderTabs();render();
}
loadAll();
</script>
