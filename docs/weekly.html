<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Báo Cáo Tổng Hợp Tuần — Trend Radar</title>
  <meta name="description" content="Báo cáo phân tích tổng hợp xu hướng thị trường, cơ hội và công nghệ hàng tuần từ Trend Radar.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --bg-card: rgba(17, 24, 39, 0.72);
      --bg-card-hover: rgba(30, 41, 59, 0.85);
      --bg-card-solid: #0f172a;
      --fg: #f1f5f9;
      --fg-dim: #94a3b8;
      --fg-muted: #64748b;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --hot: #f97316;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(99, 102, 241, 0.4);
      --score-high: #10b981;
      --score-mid: #f59e0b;
      --score-low: #64748b;
      --font-sans: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-full: 9999px;
      --transition-fast: 0.16s cubic-bezier(0.16, 1, 0.3, 1);
      --glass-blur: blur(16px);
      --shadow-card: 0 4px 24px -2px rgba(0, 0, 0, 0.45);
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --bg-card: rgba(255, 255, 255, 0.9);
      --bg-card-hover: #ffffff;
      --bg-card-solid: #ffffff;
      --fg: #0f172a;
      --fg-dim: #475569;
      --fg-muted: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --hot: #ea580c;
      --border: rgba(0, 0, 0, 0.08);
      --border-hover: rgba(37, 99, 235, 0.3);
      --score-high: #059669;
      --score-mid: #d97706;
      --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      min-height: 100vh;
      padding: 24px 20px 80px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      background-image: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.08) 0%, transparent 60%);
      background-attachment: fixed;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }
    .container { max-width: 960px; margin: 0 auto; }
    
    /* Top Header Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding: 14px 20px;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      position: sticky;
      top: 12px;
      z-index: 100;
      box-shadow: 0 8px 32px -4px rgba(0, 0, 0, 0.35);
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 600;
      color: var(--fg-dim);
      transition: all var(--transition-fast);
    }
    .back-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--fg);
      border-color: var(--border-hover);
    }
    .brand-title {
      font-size: 16px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 40%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .week-select-box {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      font-size: 12px;
      color: var(--fg);
      font-weight: 600;
    }
    .week-select-box select {
      background: transparent;
      border: none;
      color: inherit;
      font-family: inherit;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }
    .theme-btn {
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 600;
      color: var(--fg-dim);
      transition: all var(--transition-fast);
    }
    .theme-btn:hover { background: rgba(255, 255, 255, 0.1); color: var(--fg); }

    /* Hero Banner */
    .report-hero {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.85) 100%);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: var(--radius-xl);
      padding: 24px 28px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-card);
      backdrop-filter: var(--glass-blur);
    }
    .report-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 12px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: var(--radius-full);
      color: #34d399;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }
    .report-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--fg);
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    .report-meta {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: var(--fg-dim);
      flex-wrap: wrap;
    }

    /* Section Cards */
    .sec-card {
      background: var(--bg-card);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-card);
    }
    .sec-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--fg);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .sec-title-text {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Comparison Table */
    .comp-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .comp-table th, .comp-table td {
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .comp-table th {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--fg-dim);
      background: rgba(255, 255, 255, 0.02);
      font-weight: 700;
    }
    .comp-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    /* Cards & Grids */
    .opp-item-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      margin-bottom: 10px;
      transition: all var(--transition-fast);
    }
    .opp-item-row:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(99, 102, 241, 0.4);
      transform: translateY(-1px);
    }
    .opp-score-badge {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.35);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .opp-item-main {
      flex: 1;
      min-width: 0;
    }
    .opp-item-title {
      font-weight: 700;
      font-size: 14px;
      color: var(--fg);
      margin-bottom: 4px;
      display: inline-block;
    }
    .opp-item-title:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }
    .opp-item-summary {
      font-size: 12.5px;
      color: var(--fg-dim);
      line-height: 1.5;
    }

    /* Funding deal pills */
    .deal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }
    .deal-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .deal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .deal-amount {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 800;
      color: #34d399;
    }
    .deal-sector {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
      text-transform: uppercase;
    }

    /* Checklist & Notes */
    .checklist-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .check-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13.5px;
      color: var(--fg);
    }
    .notes-textarea {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      color: var(--fg);
      font-family: inherit;
      font-size: 13px;
      line-height: 1.55;
      min-height: 100px;
      resize: vertical;
      outline: none;
      transition: border-color var(--transition-fast);
    }
    .notes-textarea:focus { border-color: var(--accent); }

    /* Footer Action Bar */
    .footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 32px;
      padding: 16px 20px;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
    }
    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .btn-action-primary {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: #fff;
      box-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
    }
    .btn-action-primary:hover {
      background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
      transform: translateY(-1px);
    }
    .btn-action-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--fg);
    }
    .btn-action-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--border-hover);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #10b981;
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      padding: 10px 18px;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      z-index: 10001;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header Bar -->
    <header class="header-bar">
      <div class="header-left">
        <a href="index.html" class="back-btn">
          <span>&larr; Về Dashboard</span>
        </a>
        <div class="brand-title">Trend Radar — Báo Cáo Tuần</div>
      </div>
      <div class="header-actions">
        <div class="week-select-box">
          <span>Chọn tuần:</span>
          <select id="weekSelect" onchange="onWeekChange(this.value)">
            <option value="weekly_latest.json">W43 (Mới nhất)</option>
          </select>
        </div>
        <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">☀️ Sáng</button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main id="mainContent">
      <div style="text-align: center; padding: 60px; color: var(--fg-dim);">Đang tải báo cáo tổng hợp tuần...</div>
    </main>

    <!-- Footer Action Bar -->
    <div class="footer-actions">
      <div style="font-size: 12px; color: var(--fg-dim);">
        <span>💡 Dữ liệu lưu trữ 52 tuần tại <code>docs/data/weekly/</code></span>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button class="btn-action btn-action-secondary" onclick="copyMarkdownReport()">📋 Copy Markdown</button>
        <button class="btn-action btn-action-secondary" onclick="downloadCurrentJson()">💾 Tải JSON</button>
        <button class="btn-action btn-action-primary" onclick="downloadCurrentMd()">💾 Tải Báo Cáo (.md)</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toastMsg">✅ Đã sao chép!</div>

  <script>
    let CURRENT_DATA = null;
    let WEEKS_INDEX = [];

    async function init() {
      await loadWeeksIndex();
      await loadReport('weekly_latest.json');
      initTheme();
    }

    async function loadWeeksIndex() {
      try {
        const res = await fetch('data/weekly/weeks_index.json');
        if (res.ok) {
          WEEKS_INDEX = await res.json();
          const sel = document.getElementById('weekSelect');
          sel.innerHTML = WEEKS_INDEX.map(w => 
            `<option value="${w.filename}">${w.week} (${w.start_date} &rarr; ${w.end_date})</option>`
          ).join('');
        }
      } catch (e) {
        console.warn('Could not load weeks_index.json:', e);
      }
    }

    async function loadReport(filename) {
      const container = document.getElementById('mainContent');
      container.innerHTML = '<div style="text-align: center; padding: 60px; color: var(--fg-dim);">Đang tải dữ liệu tuần...</div>';
      try {
        const res = await fetch('data/weekly/' + filename);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        CURRENT_DATA = await res.json();
        renderReport(CURRENT_DATA);
      } catch (err) {
        container.innerHTML = `<div style="text-align: center; padding: 60px; color: #f87171;">⚠️ Lỗi tải báo cáo: ${err.message}. Vui lòng thử lại.</div>`;
      }
    }

    function onWeekChange(filename) {
      loadReport(filename);
    }

    function renderReport(data) {
      const container = document.getElementById('mainContent');
      const st = data.stats || {};
      const pst = data.prev_stats || {};
      const disruption = data.disruption_snapshot || {};
      const savedNotes = localStorage.getItem('trend_radar_notes_' + data.week) || '';

      function diffBadge(curr, prev) {
        const diff = (curr || 0) - (prev || 0);
        const pct = prev ? Math.round((diff / prev) * 100) : 0;
        const sign = diff > 0 ? '+' : '';
        const color = diff > 0 ? '#34d399' : (diff < 0 ? '#f87171' : 'var(--fg-dim)');
        return `<span style="color: ${color}; font-weight: 700; font-family: var(--font-mono);">${sign}${diff} (${sign}${pct}%)</span>`;
      }

      container.innerHTML = `
        <!-- Hero Banner -->
        <div class="report-hero">
          <div class="report-badge">📅 BÁO CÁO TỔNG HỢP TUẦN ${data.week}</div>
          <h1 class="report-title">Xu Hướng Thị Trường & Cơ Hội Tuần ${data.week}</h1>
          <div class="report-meta">
            <span>🗓 <strong>Khoảng thời gian:</strong> ${data.start_date} đến ${data.end_date}</span>
            <span>⚡ <strong>So với tuần trước:</strong> ${data.previous_week || 'N/A'}</span>
            <span>⏱ <strong>Lưu trữ:</strong> Chu kỳ 52 tuần (1 năm)</span>
          </div>
        </div>

        <!-- 1. Tổng quan thị trường -->
        <div class="sec-card">
          <div class="sec-title">
            <span class="sec-title-text">📊 1. Tổng Quan Thị Trường (So Sánh ${data.week} vs ${data.previous_week || 'Tuần Trước'})</span>
          </div>
          <table class="comp-table">
            <thead>
              <tr>
                <th>Chỉ số quan trắc</th>
                <th>Tuần trước (${data.previous_week || 'Trước'})</th>
                <th>Tuần này (${data.week})</th>
                <th>Tăng trưởng / Thay đổi</th>
                <th>Đánh giá xu thế</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><strong>Tổng tín hiệu đầu vào</strong></td>
                <td>${pst.total_signals || 0}</td>
                <td><strong style="font-size: 15px; color: var(--fg);">${st.total_signals || 0}</strong></td>
                <td>${diffBadge(st.total_signals, pst.total_signals)}</td>
                <td><span style="color: #34d399;">Nguồn dữ liệu mở rộng</span></td>
              </tr>
              <tr>
                <td><strong>Tổng số cơ hội lọc được</strong></td>
                <td>${pst.total_opportunities || 0}</td>
                <td><strong style="font-size: 15px; color: var(--fg);">${st.total_opportunities || 0}</strong></td>
                <td>${diffBadge(st.total_opportunities, pst.total_opportunities)}</td>
                <td><span style="color: #34d399;">Chất lượng duy trì cao</span></td>
              </tr>
              <tr>
                <td><span style="color: #f87171;">🔴</span> <strong>Build-ready (9/9)</strong></td>
                <td>${pst.build_ready || 0}</td>
                <td><strong style="color: #f87171;">${st.build_ready || 0}</strong></td>
                <td>${diffBadge(st.build_ready, pst.build_ready)}</td>
                <td>Đúng ngách IoT & cảm biến nước</td>
              </tr>
              <tr>
                <td><span style="color: #fbbf24;">🟡</span> <strong>Research (7–8/9)</strong></td>
                <td>${pst.research || 0}</td>
                <td><strong style="color: #fbbf24;">${st.research || 0}</strong></td>
                <td>${diffBadge(st.research, pst.research)}</td>
                <td>Khối lượng nghiên cứu dồi dào</td>
              </tr>
              <tr>
                <td><span style="color: #94a3b8;">⚪</span> <strong>Watch (4–6/9)</strong></td>
                <td>${pst.watch || 0}</td>
                <td><strong>${st.watch || 0}</strong></td>
                <td>${diffBadge(st.watch, pst.watch)}</td>
                <td>Dòng tín hiệu thị trường rộng</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- 2. Top 5 Cơ hội nổi bật -->
        <div class="sec-card">
          <div class="sec-title">
            <span class="sec-title-text">🎯 2. Top Cơ Hội Nổi Bật Nhất Tuần</span>
            <span style="font-size: 12px; color: var(--fg-dim); font-weight: 500;">Ưu tiên điểm 9/9</span>
          </div>
          <div class="opp-list">
            ${(data.top_opportunities || []).map((opp, idx) => `
              <div class="opp-item-row">
                <span class="opp-score-badge">🔴 ${opp.total}/9</span>
                <div class="opp-item-main">
                  <a href="${opp.url || '#'}" target="_blank" class="opp-item-title">#${idx + 1}. ${escapeHtml(opp.title)} ↗</a>
                  <div class="opp-item-summary">${escapeHtml(opp.summary_vi || opp.summary || '')}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- 3. Dòng tiền nổi bật -->
        <div class="sec-card">
          <div class="sec-title">
            <span class="sec-title-text">💰 3. Dòng Tiền & Thương Vụ Nổi Bật</span>
          </div>
          <div class="deal-grid">
            ${(data.funding_deals || []).map(deal => `
              <div class="deal-card">
                <div class="deal-top">
                  <span class="deal-amount">${deal.amount || 'N/A'}</span>
                  <span class="deal-sector">${deal.sector_vi || deal.sector || 'Chung'}</span>
                </div>
                <div style="font-weight: 700; font-size: 13px; color: var(--fg);">
                  <a href="${deal.url || '#'}" target="_blank">${escapeHtml(deal.title)} ↗</a>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- 4. Chủ đề nóng & 5. Công nghệ -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
          <div class="sec-card" style="margin-bottom: 0;">
            <div class="sec-title">
              <span class="sec-title-text">🔥 4. Chủ Đề Thảo Luận Nóng</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
              <div>
                <div style="font-size: 11px; font-weight: 700; color: #f97316; margin-bottom: 4px;">REDDIT TOP POSTS</div>
                ${(data.hot_topics?.reddit_top3 || []).map(p => `
                  <div style="font-size: 12.5px; margin-bottom: 6px;">
                    <a href="${p.url || '#'}" target="_blank" style="color: var(--fg);">• ${escapeHtml(p.title)}</a>
                    <span style="font-size: 11px; color: var(--fg-dim);">(${p.source || 'Reddit'} · ⬆ ${p.upvotes || 0})</span>
                  </div>
                `).join('')}
              </div>
              <div style="border-top: 1px solid var(--border); padding-top: 8px;">
                <div style="font-size: 11px; font-weight: 700; color: #3b82f6; margin-bottom: 4px;">GOOGLE TRENDS</div>
                <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                  ${(data.hot_topics?.google_trends_top3 || []).map(k => `
                    <span style="font-size: 11px; padding: 2px 8px; border-radius: 999px; background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3);">🔍 ${escapeHtml(k.keyword || k)}</span>
                  `).join('')}
                </div>
              </div>
            </div>
          </div>

          <div class="sec-card" style="margin-bottom: 0;">
            <div class="sec-title">
              <span class="sec-title-text">🔬 5. Tần Suất Công Nghệ</span>
            </div>
            <table class="comp-table" style="font-size: 12px;">
              <thead>
                <tr>
                  <th>Tech</th>
                  <th>Số lần</th>
                  <th>Trước</th>
                  <th>Xu hướng</th>
                </tr>
              </thead>
              <tbody>
                ${Object.entries(data.tech_frequency || {}).slice(0, 6).map(([tech, info]) => `
                  <tr>
                    <td><strong>${escapeHtml(tech)}</strong></td>
                    <td><strong>${info.count}</strong></td>
                    <td>${info.prev_week}</td>
                    <td><span style="color: ${info.change_pct >= 0 ? '#34d399' : '#f87171'}; font-weight: 700;">+${info.change_pct}%</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>

        <!-- 6. Thuật ngữ mới & 7. AI Disruption Snapshot -->
        <div class="sec-card">
          <div class="sec-title">
            <span class="sec-title-text">⚡ 6. Thuật Ngữ Mới & 7. AI Disruption Snapshot</span>
          </div>
          <div style="margin-bottom: 14px;">
            <div style="font-size: 12px; font-weight: 700; color: #c084fc; margin-bottom: 6px;">THUẬT NGỮ MỚI PHÁT HIỆN TUẦN NÀY:</div>
            <div style="display: flex; gap: 6px; flex-wrap: wrap;">
              ${(data.new_terms || []).map(t => `
                <span style="font-size: 11px; padding: 2px 8px; border-radius: var(--radius-full); background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.35); font-family: var(--font-mono); font-weight: 600;">✨ ${escapeHtml(t)}</span>
              `).join('')}
            </div>
          </div>
          <div style="background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <span style="font-size: 13px; font-weight: 700; color: #fca5a5;">⚡ Skill bị AI can thiệp mạnh nhất:</span>
              <span style="font-size: 13px; font-weight: 800; color: #f87171; font-family: var(--font-mono);">${disruption.most_disrupted_skill || 'Viết code boilerplate'} (${disruption.ai_pct || 88}%)</span>
            </div>
            <div style="font-size: 12.5px; color: var(--fg-dim); line-height: 1.5;">
              Phân bổ kỹ năng: 🟢 An toàn: <strong>${disruption.safe_count || 16}</strong> | 🟡 Cơ hội cầu nối: <strong>${disruption.opportunity_count || 12}</strong> | 🔴 Cần tránh: <strong>${disruption.avoid_count || 2}</strong>. Lợi thế chuyển dịch từ người *viết code boilerplate* sang người *am hiểu phần cứng thực tế, tích hợp TinyML và làm cầu nối kiến trúc hệ thống*.
            </div>
          </div>
        </div>

        <!-- 8. Hành động tuần tới -->
        <div class="sec-card">
          <div class="sec-title">
            <span class="sec-title-text">📋 8. Hành Động Tuần Tới (Actionable Checklist)</span>
          </div>
          <div class="checklist-list">
            <label class="check-item"><input type="checkbox"> <strong>Cơ hội #1:</strong> Khảo sát thực địa 3 kỹ sư/chủ ao về nhu cầu tự động hóa đo đếm môi trường nước.</label>
            <label class="check-item"><input type="checkbox"> <strong>Công nghệ:</strong> Thử nghiệm module cảm biến mới kết hợp vi điều khiển thế hệ mới (RP2350 / ESP32-C6).</label>
            <label class="check-item"><input type="checkbox"> <strong>Dòng tiền:</strong> Theo dõi các động thái hợp tác tiếp theo của thương vụ M&A mảng submetering & leak detection.</label>
            <label class="check-item"><input type="checkbox"> <strong>Bookmarks:</strong> Review lại các cơ hội đang gắn tag researching trong bookmarks.</label>
          </div>
        </div>

        <!-- 9. Ghi chú cá nhân -->
        <div class="sec-card">
          <div class="sec-title">
            <span class="sec-title-text">✍️ 9. Ghi Chú Cá Nhân (Tự động lưu)</span>
          </div>
          <textarea class="notes-textarea" id="personalNotes" placeholder="Nhập ghi chú chiến lược, phân tích riêng cho tuần ${data.week}..." oninput="savePersonalNotes('${data.week}', this.value)">${escapeHtml(savedNotes)}</textarea>
        </div>
      `;
    }

    function savePersonalNotes(week, val) {
      localStorage.setItem('trend_radar_notes_' + week, val);
    }

    function showToast(msg) {
      const el = document.getElementById('toastMsg');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 2500);
    }

    function copyMarkdownReport() {
      if (!CURRENT_DATA) return;
      fetch('data/weekly/' + (CURRENT_DATA.week ? `${CURRENT_DATA.week}_${CURRENT_DATA.start_date}_to_${CURRENT_DATA.end_date}.md` : 'weekly_latest.md'))
        .then(r => r.text())
        .then(text => {
          navigator.clipboard.writeText(text);
          showToast('✅ Đã sao chép toàn bộ Markdown Báo Cáo Tuần!');
        }).catch(err => {
          alert('Không thể sao chép: ' + err);
        });
    }

    function downloadCurrentJson() {
      if (!CURRENT_DATA) return;
      const str = JSON.stringify(CURRENT_DATA, null, 2);
      const blob = new Blob([str], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${CURRENT_DATA.week || 'weekly'}_report.json`;
      a.click();
    }

    function downloadCurrentMd() {
      if (!CURRENT_DATA) return;
      fetch('data/weekly/' + (CURRENT_DATA.week ? `${CURRENT_DATA.week}_${CURRENT_DATA.start_date}_to_${CURRENT_DATA.end_date}.md` : 'weekly_latest.md'))
        .then(r => r.text())
        .then(text => {
          const blob = new Blob([text], { type: 'text/markdown' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `${CURRENT_DATA.week || 'weekly'}_report.md`;
          a.click();
        });
    }

    function toggleTheme() {
      const curr = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = curr === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('trend_radar_theme', next);
      document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️ Sáng' : '🌙 Tối';
    }

    function initTheme() {
      const saved = localStorage.getItem('trend_radar_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
      document.getElementById('themeBtn').textContent = saved === 'dark' ? '☀️ Sáng' : '🌙 Tối';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    init();
  </script>
</body>
</html>
