services:
  glance:
    image: glanceapp/glance
    volumes:
      - ./glance.yml:/app/config/glance.yml
    ports:
      - 8686:8686
    depends_on:
      - rsshub
    restart: unless-stopped

  rsshub:
    image: diygod/rsshub:latest
    ports:
      - 1200:1200
    environment:
      CACHE_TYPE: redis
      REDIS_URL: "redis://redis:6379/"
    depends_on:
      - redis
    restart: unless-stopped

  miniflux:
    image: miniflux/miniflux:latest
    ports:
      - 8080:8080
    environment:
      DATABASE_URL: "postgres://miniflux:secret@postgres/miniflux?sslmode=disable"
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: trendradar
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: miniflux
    volumes:
      - miniflux-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "miniflux"]
      interval: 10s
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped

  skill-dashboard:
    image: halverneus/static-file-server:latest
    volumes:
      - /Users/felixtruong/Desktop/skill-funnel/docs:/web
    environment:
      PORT: 8765
    ports:
      - 8765:8765
    restart: unless-stopped

volumes:
  redis-data:
  miniflux-db:
