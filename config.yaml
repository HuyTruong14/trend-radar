# Trend Radar config
# Add / remove keywords and feeds any time — no code changes needed.

topics:
  ai-tech:
    label: "AI & Technology"
    keywords:
      - "AI video"
      - "video generation"
      - "generative AI"
      - "AI agent"
      - "large language model"
    hackernews: true
    arxiv:
      categories: ["cs.AI", "cs.CV", "cs.CL"]
      keywords:
        - "video generation"
        - "diffusion model"
        - "AI agent"
    github_search:
      # GitHub Search API query terms (repos with recent activity)
      - "ai video generation"
      - "llm agent"
    rss: []

