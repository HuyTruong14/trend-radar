# Trend Radar config
# Add / remove keywords and feeds any time — no code changes needed.

topics:
  ai-tech:
    label: "AI & Technology"
    keywords:
      - "AI video"
      - "video generation"
      - "generative AI"
      - "AI agent"
      - "large language model"
    hackernews: true
    arxiv:
      categories: ["cs.AI", "cs.CV", "cs.CL"]
      keywords:
        - "video generation"
        - "diffusion model"
        - "AI agent"
    github_search:
      # GitHub Search API query terms (repos with recent activity)
      - "ai video generation"
      - "llm agent"
    rss: []

  igaming:
    label: "iGaming & Gaming"
    keywords:
      - "igaming"
      - "online casino"
      - "sports betting"
      - "slot provider"
      - "game aggregator"
    hackernews: false
    arxiv:
      categories: []
      keywords: []
    github_search: []
    rss:
      - "https://sbcnews.co.uk/feed/"
      - "https://igamingbusiness.com/feed/"

  business:
    label: "Business & Funding"
    keywords: []
    hackernews: false
    arxiv:
      categories: []
      keywords: []
    github_search: []
    rss:
      - "https://techcrunch.com/category/venture/feed/"
      - "https://news.crunchbase.com/feed/"
      - "https://a16z.com/feed/"
      - "https://hbr.org/feed"

  news:
    label: "News (theo từ khóa)"
    keywords: []
    hackernews: false
    arxiv:
      categories: []
      keywords: []
    github_search: []
    rss:
      - "https://news.google.com/rss/search?q=igaming+regulation&hl=vi-VN&gl=VN&ceid=VN:vi"
      - "https://news.google.com/rss/search?q=AI+regulation&hl=vi-VN&gl=VN&ceid=VN:vi"

# How many items to keep per source, per topic
max_items_per_source: 15

# Only keep items published in the last N days (freshness filter)
freshness_days: 14

# How many days of daily history snapshots to keep per topic
history_days: 60
