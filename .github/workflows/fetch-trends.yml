name: Fetch trends

on:
  schedule:
    # 00:00 UTC daily (= 07:00 Vietnam time).
    - cron: "0 0 * * *"
    # 13:00 UTC every Sunday (= 20:00 Vietnam time Sunday) for Weekly Archive (Phase 14).
    - cron: "0 13 * * 0"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GOOGLE_CSE_KEY: ${{ secrets.GOOGLE_CSE_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
        run: python scripts/fetch.py

      - name: Run Opportunity Radar scoring
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/score.py

      - name: Extract Tech Glossary and Trends (Phase 13)
        run: python scripts/tech_glossary.py

      - name: Generate Repo Combos and Product Ideas (Phase 12)
        run: python scripts/repo_combos.py

      - name: Generate Daily Digest and send Telegram (Phase 10)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/daily_digest.py --send-telegram

      - name: Generate Weekly Archive (Phase 14)
        run: python scripts/weekly_archive.py

      - name: Index into RAGFlow
        if: env.RAGFLOW_API_KEY != ''
        env:
          RAGFLOW_API_KEY: ${{ secrets.RAGFLOW_API_KEY }}
        run: python scripts/index_ragflow.py

      - name: Commit updated data
        run: |
          git config user.name "trend-radar-bot"
          git config user.email "actions@github.com"
          git add docs/data/*.json docs/data/history/*.json docs/data/weekly/*
          git diff --quiet --cached || git commit -m "Update trend data and weekly archive $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ Trend Radar workflow fail — kiểm tra Actions log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
